---
# nekonolock を動かすユーザー。単一 UID 前提（設計 §3）。
nekonolock_user: "{{ ansible_user_id }}"

nekonolock_package: nekonolock
# /etc/pam.d 配下のファイル名。'/' や改行は role が拒否する。
nekonolock_pam_service: nekonolock
# login は system-login -> system-auth を辿るため、pam_faillock が効く。
nekonolock_pam_include: login

# ログイン中のユーザーセッションで socket activation を有効にする。
nekonolock_enable_user_socket: true

# swayidle の lock コマンドを nekonolock に差し替える。
nekonolock_manage_swayidle: true
nekonolock_sway_config: "~{{ nekonolock_user }}/.config/sway/config"
nekonolock_idle_timeout: 300
nekonolock_dpms_timeout: 600
# 差し替え後の 1 行。exec は lineinfile 側で保持する。
nekonolock_swayidle_command: >-
  swayidle -w
  timeout {{ nekonolock_idle_timeout }} 'nekonolock'
  timeout {{ nekonolock_dpms_timeout }} 'swaymsg "output * power off"'
  resume 'swaymsg "output * power on"'
  before-sleep 'nekonolock'

# sudo 用の YubiKey 認証。既定は無効で、ロック画面だけを使う
# ホストの PAM 設定を変えない。有効にする場合は key と公開鍵を渡す。
nekonolock_sudo_auth: false
nekonolock_sudo_key: ""
# ASCII armored の公開鍵。lookup('file', ...) で読み込んで渡してもよい。
nekonolock_sudo_public_key: ""
nekonolock_sudo_config: /etc/nekonolock/sudo.toml
nekonolock_sudo_public_key_path: /etc/nekonolock/sudo-key.asc
nekonolock_sudo_challenge_bytes: 32
nekonolock_sudo_timeout_sec: 30
nekonolock_sudo_users: []
# 'auth include system-auth' の直前に sufficient で挿す。失敗時は
# pam_nekonolock が PAM_IGNORE を返すので、パスワード認証へ進む。
nekonolock_sudo_pam_service: sudo
nekonolock_sudo_pam_include: system-auth
