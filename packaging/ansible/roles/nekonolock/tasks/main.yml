---
# ロール変数は root で /etc とユーザーの home に書くため、パスとして安全な
# 文字だけを受け付ける。service 名に '/' や改行を許すと /etc/pam.d の外や
# PAM 行の注入になる。
- name: Validate role inputs
  ansible.builtin.assert:
    that:
      - nekonolock_pam_service is match('^[A-Za-z0-9_.-]+$')
      - nekonolock_pam_include is match('^[A-Za-z0-9_.-]+$')
      - nekonolock_user is match('^[A-Za-z0-9_.@-]+$')
    fail_msg: >-
      nekonolock_pam_service / nekonolock_pam_include / nekonolock_user は
      ファイル名・PAM サービス名として安全な文字だけにする。
  tags: always

# ユーザー名から home / uid を引く。getent は register した facts に入る。
- name: Look up the nekonolock user
  ansible.builtin.getent:
    database: passwd
    key: "{{ nekonolock_user }}"
    fail_key: true
  register: nekonolock_getent

- name: Record the target user's home and uid
  ansible.builtin.set_fact:
    nekonolock_home: "{{ nekonolock_getent.ansible_facts.getent_passwd[nekonolock_user][4] }}"
    nekonolock_uid: "{{ nekonolock_getent.ansible_facts.getent_passwd[nekonolock_user][1] }}"

- name: Install the nekonolock package
  ansible.builtin.package:
    name: "{{ nekonolock_package }}"
    state: present

# package も /etc/pam.d/nekonolock を同梱するが、PAM はホストの認証方針なので
# ansible 側を正にする。pam_faillock の有無などで include 先を変えられる。
- name: Deploy the PAM service for nekonolock
  ansible.builtin.template:
    src: nekonolock.pam.j2
    dest: "/etc/pam.d/{{ nekonolock_pam_service }}"
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: Check whether the user manager is running
  ansible.builtin.stat:
    path: "/run/user/{{ nekonolock_uid }}/systemd/private"
  register: nekonolock_user_manager

- name: Enable and start nekonolock-auth.socket
  ansible.builtin.systemd_service:
    name: nekonolock-auth.socket
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ nekonolock_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ nekonolock_uid }}"
  when:
    - nekonolock_enable_user_socket | bool
    - nekonolock_user_manager.stat.exists

- name: Warn when the user manager is not running
  ansible.builtin.debug:
    msg: >-
      /run/user/{{ nekonolock_uid }}/systemd/private が無いため
      nekonolock-auth.socket を有効化していない。ログイン中に role を再実行するか、
      `systemctl --user enable --now nekonolock-auth.socket` を実行する。
  when:
    - nekonolock_enable_user_socket | bool
    - not nekonolock_user_manager.stat.exists

- name: Check for the sway config
  ansible.builtin.stat:
    path: "{{ nekonolock_sway_config }}"
    follow: false
  register: nekonolock_sway

# 自動ロックの設定漏れを黙って成功にしない（設計の fail closed）。
- name: Fail when the sway config is missing
  ansible.builtin.fail:
    msg: >-
      {{ nekonolock_sway_config }} が無いため swayidle を設定できない。
      sway を使わないホストでは nekonolock_manage_swayidle: false にする。
  when:
    - nekonolock_manage_swayidle | bool
    - not nekonolock_sway.stat.exists

# symlink は dotfiles 管理でよく使うので、実体がユーザーの home 内にある
# 場合だけ許可する。root が home 外を指す symlink を辿って書かない。
- name: Resolve the sway config
  ansible.builtin.command:
    argv:
      - realpath
      - -e
      - "{{ nekonolock_sway_config }}"
  register: nekonolock_sway_real
  changed_when: false
  when:
    - nekonolock_manage_swayidle | bool
    - nekonolock_sway.stat.exists

- name: Refuse a sway config outside the user's home
  ansible.builtin.assert:
    that:
      - nekonolock_sway_real.rc == 0
      - nekonolock_sway_real.stdout is match('^' ~ (nekonolock_home | regex_escape) ~ '/')
    fail_msg: >-
      {{ nekonolock_sway_config }} の実体が {{ nekonolock_home }} の外を指している。
      root が home 外のファイルを書き換えないよう拒否する。
  when:
    - nekonolock_manage_swayidle | bool
    - nekonolock_sway.stat.exists

# 既存の `exec swayidle ...` 行だけを置き換える。設定が無いホストでは何もしない。
# ユーザーの file は root ではなく対象ユーザーとして編集する。root が
# ユーザー所有の path を辿って書く経路を残さない。
- name: Point swayidle at nekonolock
  ansible.builtin.lineinfile:
    path: "{{ nekonolock_sway_real.stdout }}"
    regexp: '^(\s*exec(?:_always)?\s+)swayidle\b.*$'
    line: '\1{{ nekonolock_swayidle_command }}'
    backup: true
    backrefs: true
  become: "{{ nekonolock_user != ansible_user_id }}"
  become_user: "{{ nekonolock_user }}"
  when:
    - nekonolock_manage_swayidle | bool
    - nekonolock_sway.stat.exists

# --- sudo 用 PAM モジュール -------------------------------------------------

# 有効にするときだけ、鍵と PAM の設定を検証する。無効時は何も変えない。
- name: Validate sudo PAM inputs
  ansible.builtin.assert:
    that:
      - nekonolock_sudo_key is match('^([0-9A-Fa-f]{16}|[0-9A-Fa-f]{40})!?$')
      - nekonolock_sudo_public_key | length > 0
      - nekonolock_sudo_public_key is search('-----BEGIN PGP PUBLIC KEY BLOCK-----')
      - nekonolock_sudo_public_key_path is match('^/[A-Za-z0-9_./-]+$')
      - nekonolock_sudo_config is match('^/[A-Za-z0-9_./-]+$')
      - nekonolock_sudo_pam_service is match('^[A-Za-z0-9_.-]+$')
      - nekonolock_sudo_pam_include is match('^[A-Za-z0-9_.-]+$')
      - nekonolock_sudo_users | select('match', '^[A-Za-z0-9_.@-]+$') | list | length == nekonolock_sudo_users | length
      - nekonolock_sudo_timestamp_type in ['', 'tty', 'ppid', 'global']
    fail_msg: >-
      nekonolock_sudo_auth を有効にするには、16/40 桁の key、ASCII armored の
      公開鍵、絶対パスの public_key_path/config、安全な PAM サービス名が必要。
      nekonolock_sudo_timestamp_type は tty / ppid / global / 空 のどれか。
  when: nekonolock_sudo_auth | bool
  tags: always

- name: Check the sudo PAM service
  ansible.builtin.stat:
    path: "/etc/pam.d/{{ nekonolock_sudo_pam_service }}"
  register: nekonolock_sudo_pam_file

- name: Fail when the sudo PAM service is missing
  ansible.builtin.fail:
    msg: >-
      /etc/pam.d/{{ nekonolock_sudo_pam_service }} が無い。
      nekonolock_sudo_pam_service を確認するか、nekonolock_sudo_auth: false にする。
  when:
    - nekonolock_sudo_auth | bool
    - not nekonolock_sudo_pam_file.stat.exists

- name: Check the PAM include line for sudo
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - "^auth\\s+include\\s+{{ nekonolock_sudo_pam_include }}\\s*$"
      - "/etc/pam.d/{{ nekonolock_sudo_pam_service }}"
  changed_when: false
  when: nekonolock_sudo_auth | bool

- name: Ensure /etc/nekonolock exists
  ansible.builtin.file:
    path: "{{ nekonolock_sudo_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nekonolock_sudo_auth | bool

- name: Deploy the sudo card config
  ansible.builtin.template:
    src: nekonolock-sudo.toml.j2
    dest: "{{ nekonolock_sudo_config }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: nekonolock_sudo_auth | bool

- name: Deploy the sudo verification key
  ansible.builtin.copy:
    content: "{{ nekonolock_sudo_public_key | trim }}\n"
    dest: "{{ nekonolock_sudo_public_key_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: nekonolock_sudo_auth | bool

# sudo の timestamp は PAM の外側で決まる。global / ppid だと 1 回の認証が
# 別の pty にも効くため、パスワード認証と同じ per-pty の挙動にする。
# /etc/sudoers.d を include していないホストでは効かないので、その場合は
# nekonolock_sudo_timestamp_type を空にしてホスト側で設定する。
- name: Enforce per-tty sudo timestamps
  ansible.builtin.copy:
    content: |
      # Managed by ansible (nekonolock).
      Defaults timestamp_type={{ nekonolock_sudo_timestamp_type }}
    dest: /etc/sudoers.d/nekonolock
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when:
    - nekonolock_sudo_auth | bool
    - (nekonolock_sudo_timestamp_type | length) > 0

- name: Remove the sudo timestamp policy
  ansible.builtin.file:
    path: /etc/sudoers.d/nekonolock
    state: absent
  when: not (nekonolock_sudo_auth | bool)

- name: Enable the card prompt for sudo
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ nekonolock_sudo_pam_service }}"
    regexp: '^auth\s+sufficient\s+pam_nekonolock\.so(\s|$)'
    line: "auth sufficient pam_nekonolock.so"
    insertbefore: '^auth\s+include\s+{{ nekonolock_sudo_pam_include }}\s*$'
    backup: true
  when: nekonolock_sudo_auth | bool

# 無効化したときは、role が入れた 1 行だけを消す。PAM の他の行は触らない。
- name: Disable the card prompt for sudo
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ nekonolock_sudo_pam_service }}"
    regexp: '^auth\s+sufficient\s+pam_nekonolock\.so(\s|$)'
    state: absent
    backup: true
  when:
    - not (nekonolock_sudo_auth | bool)
    - nekonolock_sudo_pam_file.stat.exists
