[workspace]
members = ["crates/proto", "crates/gpg", "crates/auth", "crates/lock", "crates/pam"]
resolver = "3"

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
