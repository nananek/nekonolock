[workspace]
members = ["crates/proto", "crates/auth", "crates/lock"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
