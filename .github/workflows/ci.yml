name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (auth mocks)
        run: cargo clippy -p nekonolock-auth --all-targets --features mock-card,mock-pam -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo test (auth mocks)
        run: cargo test -p nekonolock-auth --features mock-card,mock-pam
