[package]
name = "nekonolock-proto"
description = "nekonolock の UI と認証ヘルパの間のプロトコル"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nix = { version = "0.31", features = ["socket", "time", "user"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
