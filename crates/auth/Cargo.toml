[package]
name = "nekonolock-auth"
description = "nekonolock の認証ヘルパ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# テスト専用。配布ビルドでは有効にしない（release では compile_error にする）。
mock-card = []
mock-pam = []

[dependencies]
anyhow.workspace = true
getrandom = "0.3"
libc = "0.2"
libloading = "0.8"
nekonolock-proto = { path = "../proto" }
nix = { version = "0.30", features = ["process", "socket", "time", "user"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
